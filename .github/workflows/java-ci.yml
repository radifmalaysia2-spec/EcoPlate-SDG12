name: Java compilation and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile application and tests
        run: |
          mkdir -p out-test
          find src test -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -d out-test
      - name: Run domain tests
        run: java -ea -cp out-test com.cityu.ecoplate.EcoPlateTest
